<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff8f0">
<title>🍰 Kuchen – Überweisung</title>
<style>
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:24px 16px;
    display:flex; justify-content:center; align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    background:#fff8f0; color:#2b2118;
  }
  main {
    width:min(100%,430px); background:white; border-radius:24px;
    padding:28px 22px 24px; box-shadow:0 8px 35px rgba(70,40,15,.12);
    text-align:center;
  }
  .cake { font-size:54px; line-height:1; margin-bottom:10px; }
  h1 { margin:0; font-size:30px; }
  .sub { margin:7px 0 25px; color:#786b60; font-size:15px; }
  label { display:block; text-align:left; font-weight:700; margin:0 0 8px; }
  .input-wrap { position:relative; }
  input {
    width:100%; height:54px; padding:0 52px 0 16px;
    border:2px solid #eadfd4; border-radius:14px;
    font-size:20px; outline:none; background:#fff;
    -webkit-appearance:none;
  }
  input:focus { border-color:#b97842; }
  .euro {
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    font-weight:700; color:#8b7b6e;
  }
  .hint { text-align:left; font-size:13px; color:#8b7b6e; margin-top:7px; }
  #qr {
    min-height:20px; margin:22px auto 14px;
    display:flex; justify-content:center; align-items:center;
  }
  #qr canvas {
    width:260px; height:260px; max-width:75vw;
    padding:10px; background:white; border-radius:12px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    image-rendering:pixelated;
  }
  .details {
    border-top:1px solid #eee5dd; padding-top:16px;
    line-height:1.55; font-size:14px; color:#6f6258;
  }
  .details strong { color:#2b2118; }
  .error { color:#b3261e; min-height:20px; font-size:14px; margin-top:7px; }
  .offline { margin-top:14px; font-size:12px; color:#9a8b7e; }
</style>
</head>
<body>
<main>
  <div class="cake">🍰</div>
  <h1>Kuchen</h1>
  <div class="sub">Überweisung per QR-Code</div>

  <label for="amount">Betrag</label>
  <div class="input-wrap">
    <input id="amount" type="text" inputmode="decimal" autocomplete="off"
           placeholder="z. B. 12,50" aria-label="Betrag in Euro">
    <span class="euro">€</span>
  </div>
  <div class="hint">Der Betrag ist optional.</div>

  <div id="error" class="error"></div>
  <div id="qr" aria-label="SEPA Überweisungs QR-Code"></div>

  <div class="details">
    <strong>Henning Tarras</strong><br>
    Verwendungszweck: Kuchen
  </div>
  <div class="offline">✓ Funktioniert ohne Internet</div>
</main>

<script>
/*
 * Minimaler QR-Code-Generator, direkt in dieser HTML-Datei.
 * Keine externen Bibliotheken, kein CDN, keine Internetverbindung nötig.
 */
(function(){
  const QR = (function(){
    const PAD0 = 0xEC, PAD1 = 0x11;
    function utf8(s){
      const e=encodeURIComponent(s), a=[];
      for(let i=0;i<e.length;i++){
        if(e[i]==='%'){a.push(parseInt(e.substr(i+1,2),16));i+=2}
        else a.push(e.charCodeAt(i));
      } return a;
    }
    function gfMul(x,y){
      let r=0;
      while(y){if(y&1)r^=x;y>>=1;x<<=1;if(x&0x100)x^=0x11d}
      return r;
    }
    function ecc(data,n){
      const gen=[1];
      for(let i=0;i<n;i++){
        const ng=Array(gen.length+1).fill(0), a=1;
        for(let j=0;j<gen.length;j++){
          ng[j]^=gen[j]; ng[j+1]^=gfMul(gen[j], pow(2,i));
        }
        gen.splice(0,gen.length,...ng);
      }
      const res=Array(n).fill(0);
      for(const b of data){
        const f=b^res[0]; res.shift(); res.push(0);
        for(let j=0;j<n;j++) res[j]^=gfMul(gen[j+1],f);
      } return res;
    }
    const exp=[],log=[];
    (function(){let x=1;for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)exp[i]=exp[i-255]})();
    function pow(a,n){return a===0?0:exp[(log[a]+n)%255]}
    function mask(m,r,c){
      if(m===0)return (r+c)%2===0;
      if(m===1)return r%2===0;
      if(m===2)return c%3===0;
      if(m===3)return (r+c)%3===0;
      if(m===4)return (Math.floor(r/2)+Math.floor(c/3))%2===0;
      if(m===5)return r*c%2+r*c%3===0;
      if(m===6)return (r*c%2+r*c%3)%2===0;
      return ((r*c)%3+(r+c)%2)%2===0;
    }
    function make(text){
      const bytes=utf8(text);
      // Version 4, EC-M: 64 data codewords, 36 ECC codewords.
      // Plenty for a normal EPC payload.
      if(bytes.length>60) throw Error("Der Inhalt ist zu lang.");
      const data=[0x40, (bytes.length>>8)&255, bytes.length&255, ...bytes];
      while(data.length<63)data.push(0);
      data.push(0);
      while(data.length<64)data.push((data.length%2)?PAD0:PAD1);
      const e=ecc(data,36), code=data.concat(e), n=33;
      let best=null,bestScore=1e9;
      for(let m=0;m<8;m++){
        const a=draw(code,n,m);
        const score=penalty(a,n);
        if(score<bestScore){bestScore=score;best=a}
      }
      return {a:best,n};
    }
    function draw(code,n,m){
      const a=Array.from({length:n},()=>Array(n).fill(null));
      function finder(r,c){
        for(let y=-1;y<=7;y++)for(let x=-1;x<=7;x++){
          const R=r+y,C=c+x;
          if(R<0||C<0||R>=n||C>=n)continue;
          a[R][C]=(x>=0&&x<=6&&y>=0&&y<=6&&(x===0||x===6||y===0||y===6||(x>=2&&x<=4&&y>=2&&y<=4)));
        }
      }
      finder(0,0);finder(0,n-7);finder(n-7,0);
      for(let i=8;i<n-8;i++) if(a[6][i]===null)a[6][i]=i%2===0;
      for(let i=8;i<n-8;i++) if(a[i][6]===null)a[i][6]=i%2===0;
      // alignment pattern for version 4
      const pos=[6,26];
      for(const r of pos)for(const c of pos){
        if((r===6&&c===6)||(r===6&&c===26)||(r===26&&c===6))continue;
        for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)
          a[r+y][c+x]=(Math.max(Math.abs(x),Math.abs(y))!==1)|| (x===0&&y===0);
      }
      // format info, EC level M = 0, mask m
      const fmt=(0<<3)|m, g=fmt<<10;
      let d=g;
      for(let i=14;i>=10;i--)if((d>>i)&1)d^=0x537<<(i-10);
      const f=((fmt<<10)|d)^0x5412;
      const bits=[];
      for(let i=0;i<15;i++)bits.push((f>>i)&1);
      const coords=[[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[7,8],[8,8],[8,7],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0]];
      const coords2=[[n-1,8],[n-2,8],[n-3,8],[n-4,8],[n-5,8],[n-6,8],[n-7,8],[8,n-8],[8,n-7],[8,n-6],[8,n-5],[8,n-4],[8,n-3],[8,n-2],[8,n-1]];
      for(let i=0;i<15;i++){a[coords[i][0]][coords[i][1]]=!!bits[i];a[coords2[i][0]][coords2[i][1]]=!!bits[i]}
      a[n-8][8]=true;
      const stream=[];
      for(const b of code)for(let i=7;i>=0;i--)stream.push((b>>i)&1);
      let k=0,row=n-1,up=true,col=n-1;
      while(col>0){
        if(col===6)col--;
        for(let z=0;z<n;z++){
          const r=up?n-1-z:z;
          for(let j=0;j<2;j++){
            const c=col-j;
            if(a[r][c]===null)a[r][c]=!!(stream[k++] ^ (mask(m,r,c)?1:0));
          }
        }
        up=!up;col-=2;
      }
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(a[r][c]===null)a[r][c]=false;
      return a;
    }
    function penalty(a,n){
      let p=0;
      for(let r=0;r<n;r++)for(let c=0;c<n;c++){
        const v=a[r][c];
        if(c+1<n&&a[r][c+1]===v)p+=3;
        if(r+1<n&&a[r+1][c]===v)p+=3;
      }
      return p;
    }
    return {make};
  })();

  const iban="DE47500105175401121921";
  const name="Henning Tarras";
  const purpose="Kuchen";
  const amountEl=document.getElementById("amount");
  const qrEl=document.getElementById("qr");
  const errorEl=document.getElementById("error");

  function epcPayload(){
    const raw=amountEl.value.trim();
    let amount="";
    if(raw){
      const normalized=raw.replace(/\s/g,"").replace(/\./g,"").replace(",",".");
      const value=Number(normalized);
      if(!Number.isFinite(value)||value<=0||value>999999999.99){
        throw Error("Bitte einen gültigen Betrag eingeben.");
      }
      amount=value.toFixed(2);
    }
    return ["BCD","002","1","SCT","",name,iban,amount?"EUR"+amount:"",purpose,""].join("\n");
  }

  function render(){
    errorEl.textContent="";
    try{
      const q=QR.make(epcPayload());
      const scale=8, quiet=4, size=(q.n+quiet*2)*scale;
      const canvas=document.createElement("canvas");
      canvas.width=canvas.height=size;
      canvas.setAttribute("aria-label","SEPA QR-Code");
      const ctx=canvas.getContext("2d");
      ctx.fillStyle="#fff";ctx.fillRect(0,0,size,size);
      ctx.fillStyle="#000";
      for(let r=0;r<q.n;r++)for(let c=0;c<q.n;c++)
        if(q.a[r][c])ctx.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale);
      qrEl.replaceChildren(canvas);
    }catch(e){
      qrEl.replaceChildren();
      errorEl.textContent=e.message;
    }
  }

  amountEl.addEventListener("input",render);
  render();
})();
</script>
</body>
</html>
